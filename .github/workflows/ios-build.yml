name: iOS build check

# Compiles the iOS app for the simulator without signing, to catch build errors without a Mac.
on:
  push:
    branches: [android-apk]
    paths: ['ios/**', 'src/**', 'package.json', '.github/workflows/ios-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Install pods
        working-directory: ios/App
        run: pod install
      - name: Build for the simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
