name: iOS build check

# Compiles the iOS app for devices without signing and keeps the unsigned IPA as an artifact (re-signed on the user's PC with a free Apple ID).
on:
  push:
    branches: [android-apk]
    paths: ['ios/**', 'src/**', 'package.json', '.github/workflows/ios-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Install pods
        working-directory: ios/App
        run: pod install
      - name: Build for devices (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release             -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry VaultOfAdventures-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VaultOfAdventures-unsigned-ipa
          path: ios/App/VaultOfAdventures-unsigned.ipa
          retention-days: 7
